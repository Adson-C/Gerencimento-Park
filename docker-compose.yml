 
version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: parking-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: park_api
      MYSQL_USER: park_api
      MYSQL_PASSWORD: parkapi123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: